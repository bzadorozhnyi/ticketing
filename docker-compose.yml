x-postgres: &postgres
  image: postgres:18-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 2s
    timeout: 3s
    retries: 15

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

x-service-db-env: &service-db-env
  DB__USER: postgres
  DB__PASS: password
  DB__PORT: 5432

x-ready-check: &ready-check
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
  interval: 2s
  timeout: 3s
  retries: 15

x-rust-ready-check: &rust-ready-check
  test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://localhost:8000/ready"]
  interval: 2s
  timeout: 3s
  retries: 15

x-catalog: &catalog
  build: ./services/catalog
  image: ticketing/catalog
  environment:
    <<: *service-db-env
    DB__NAME: catalog_db
    DB__HOST: catalog-db

x-booking: &booking
  build: ./services/booking
  image: ticketing/booking
  environment:
    <<: *service-db-env
    DB__NAME: booking_db
    DB__HOST: booking-db

x-payment: &payment
  build: ./services/payment
  image: ticketing/payment
  environment:
    <<: *service-db-env
    DB__NAME: payment_db
    DB__HOST: payment-db

x-seat-hold: &seat-hold
  build: ./services/seat-hold
  image: ticketing/seat-hold
  environment:
    <<: *service-db-env
    DB__NAME: seat_hold_db
    DB__HOST: seat-hold-db

services:
  gateway:
    build: ./services/gateway
    image: ticketing/gateway
    environment:
      AUTH__JWT_SECRET: local-dev-secret-with-at-least-32-bytes
      UPSTREAMS__CATALOG_URL: http://catalog:8000
    ports: ["8000:8000"]
    healthcheck: *rust-ready-check

  catalog-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: catalog_db
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["catalog-db-data:/var/lib/postgresql"]

  catalog-migrate:
    <<: *catalog
    command: ["alembic", "upgrade", "head"]
    depends_on:
      catalog-db: { condition: service_healthy }

  catalog:
    <<: *catalog
    healthcheck: *ready-check
    depends_on:
      catalog-migrate: { condition: service_completed_successfully }

  booking-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: booking_db
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["booking-db-data:/var/lib/postgresql"]

  booking-migrate:
    <<: *booking
    command: ["alembic", "upgrade", "head"]
    depends_on:
      booking-db: { condition: service_healthy }

  booking:
    <<: *booking
    healthcheck: *ready-check
    depends_on:
      booking-migrate: { condition: service_completed_successfully }

  payment-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: payment_db
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["payment-db-data:/var/lib/postgresql"]

  payment-migrate:
    <<: *payment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      payment-db: { condition: service_healthy }

  payment:
    <<: *payment
    healthcheck: *ready-check
    depends_on:
      payment-migrate: { condition: service_completed_successfully }

  seat-hold-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: seat_hold_db
    ports: ["127.0.0.1:5436:5432"]
    volumes: ["seat-hold-db-data:/var/lib/postgresql"]

  seat-hold-migrate:
    <<: *seat-hold
    command: ["migrate"]
    depends_on:
      seat-hold-db: { condition: service_healthy }

  seat-hold:
    <<: *seat-hold
    healthcheck: *rust-ready-check
    depends_on:
      seat-hold-migrate: { condition: service_completed_successfully }

volumes:
  catalog-db-data:
  booking-db-data:
  payment-db-data:
  seat-hold-db-data:
