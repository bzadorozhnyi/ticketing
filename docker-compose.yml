x-catalog-service: &catalog-service
  build: ./services/catalog
  image: ticketing/catalog
  environment:
    DB__NAME: catalog_db
    DB__USER: postgres
    DB__PASS: password
    DB__HOST: catalog-db
    DB__PORT: 5432

services:
  catalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: catalog_db
    ports:
      - "5433:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  catalog-migrate:
    <<: *catalog-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      catalog-db:
        condition: service_healthy

  catalog:
    <<: *catalog-service
    ports:
      - "8001:8000"
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  catalog-db-data:
