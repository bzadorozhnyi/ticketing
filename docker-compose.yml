x-postgres: &postgres
  image: postgres:18-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 2s
    timeout: 3s
    retries: 15

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

x-service-db-env: &service-db-env
  DB__USER: postgres
  DB__PASS: password
  DB__PORT: 5432

x-ready-check: &ready-check
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
  interval: 2s
  timeout: 3s
  retries: 15

x-rust-ready-check: &rust-ready-check
  test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://localhost:8000/ready"]
  interval: 2s
  timeout: 3s
  retries: 15

x-catalog: &catalog
  build: ./services/catalog
  image: ticketing/catalog
  environment:
    <<: *service-db-env
    DB__NAME: catalog_db
    DB__HOST: catalog-db
    OTEL_SERVICE_NAME: catalog

x-booking: &booking
  build: ./services/booking
  image: ticketing/booking
  environment:
    <<: *service-db-env
    DB__NAME: booking_db
    DB__HOST: booking-db
    OTEL_SERVICE_NAME: booking

x-payment: &payment
  build: ./services/payment
  image: ticketing/payment
  environment:
    <<: *service-db-env
    DB__NAME: payment_db
    DB__HOST: payment-db
    OTEL_SERVICE_NAME: payment

x-seat-hold: &seat-hold
  build: ./services/seat-hold
  image: ticketing/seat-hold
  environment:
    <<: *service-db-env
    DB__NAME: seat_hold_db
    DB__HOST: seat-hold-db
    OTEL_SERVICE_NAME: seat-hold

services:
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticketing
      RABBITMQ_DEFAULT_PASS: password
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    build: ./services/gateway
    image: ticketing/gateway
    environment:
      AUTH__JWT_SECRET: local-dev-secret-with-at-least-32-bytes
      RATE_LIMIT__VALKEY_URL: redis://valkey:6379
      UPSTREAMS__CATALOG_URL: http://catalog:8000
      UPSTREAMS__SEAT_HOLD_URL: http://seat-hold:8000
      UPSTREAMS__BOOKING_URL: http://booking:8000
      OTEL_SERVICE_NAME: gateway
    ports: ["8000:8000"]
    healthcheck: *rust-ready-check
    depends_on: [valkey]

  catalog-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: catalog_db
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["catalog-db-data:/var/lib/postgresql"]

  catalog-migrate:
    <<: *catalog
    command: ["alembic", "upgrade", "head"]
    depends_on:
      catalog-db: { condition: service_healthy }

  catalog:
    <<: *catalog
    healthcheck: *ready-check
    depends_on:
      catalog-migrate: { condition: service_completed_successfully }

  booking-db:
    <<: *postgres
    # The image's pg_hba.conf allows replication only from localhost; this one also lets the replica in.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      <<: *postgres-env
      POSTGRES_DB: booking_db
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - booking-db-data:/var/lib/postgresql
      - ./infra/replication/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

  # One-shot: the replication role and slot on the primary, safe to repeat (infra/replication/setup.sql).
  booking-db-replication:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: password
    command:
      - psql
      - --host=booking-db
      - --username=postgres
      - --dbname=booking_db
      - --set=ON_ERROR_STOP=1
      - --set=password=replicator-password
      - --file=/setup.sql
    volumes: ["./infra/replication/setup.sql:/setup.sql:ro"]
    depends_on:
      booking-db: { condition: service_healthy }

  # Streaming replica of booking-db, read-only; GET /orders/{id} reads from it (DB_REPLICA__*).
  booking-db-replica:
    <<: *postgres
    user: postgres
    entrypoint: ["/bin/sh", "/replica.sh"]
    environment:
      PGPASSWORD: replicator-password
      POSTGRES_USER: postgres
      POSTGRES_DB: booking_db
    ports: ["127.0.0.1:5437:5432"]
    volumes:
      - booking-db-replica-data:/var/lib/postgresql
      - ./infra/replication/replica.sh:/replica.sh:ro
    depends_on:
      booking-db-replication: { condition: service_completed_successfully }

  booking-migrate:
    <<: *booking
    command: ["alembic", "upgrade", "head"]
    depends_on:
      booking-db: { condition: service_healthy }

  booking:
    <<: *booking
    environment:
      <<: *service-db-env
      DB__NAME: booking_db
      DB__HOST: booking-db
      DB_REPLICA__NAME: booking_db
      DB_REPLICA__HOST: booking-db-replica
      DB_REPLICA__USER: postgres
      DB_REPLICA__PASS: password
      OTEL_SERVICE_NAME: booking
    healthcheck: *ready-check
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      booking-db-replica: { condition: service_started }

  booking-relay:
    <<: *booking
    command: ["python", "-m", "scripts.relay"]
    environment:
      <<: *service-db-env
      DB__NAME: booking_db
      DB__HOST: booking-db
      RABBITMQ__HOST: rabbitmq
      OTEL_SERVICE_NAME: booking-relay
    restart: on-failure
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  booking-saga:
    <<: *booking
    command: ["python", "-m", "scripts.saga"]
    environment:
      <<: *service-db-env
      DB__NAME: booking_db
      DB__HOST: booking-db
      RABBITMQ__HOST: rabbitmq
      OTEL_SERVICE_NAME: booking-saga
    restart: on-failure
    depends_on:
      booking-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  payment-consumer:
    <<: *payment
    command: ["python", "-m", "scripts.consume"]
    environment:
      <<: *service-db-env
      DB__NAME: payment_db
      DB__HOST: payment-db
      RABBITMQ__HOST: rabbitmq
      OTEL_SERVICE_NAME: payment-consumer
    restart: on-failure
    depends_on:
      payment-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  payment-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: payment_db
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["payment-db-data:/var/lib/postgresql"]

  payment-migrate:
    <<: *payment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      payment-db: { condition: service_healthy }

  payment:
    <<: *payment
    healthcheck: *ready-check
    depends_on:
      payment-migrate: { condition: service_completed_successfully }

  seat-hold-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: seat_hold_db
    ports: ["127.0.0.1:5436:5432"]
    volumes: ["seat-hold-db-data:/var/lib/postgresql"]

  seat-hold-migrate:
    <<: *seat-hold
    command: ["migrate"]
    depends_on:
      seat-hold-db: { condition: service_healthy }

  seat-hold:
    <<: *seat-hold
    healthcheck: *rust-ready-check
    depends_on:
      seat-hold-migrate: { condition: service_completed_successfully }

volumes:
  rabbitmq-data:
  catalog-db-data:
  booking-db-data:
  booking-db-replica-data:
  payment-db-data:
  seat-hold-db-data:
