repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: infra/python-services.sh ruff check --fix
        language: system
        files: ^services/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: infra/python-services.sh ruff format
        language: system
        files: ^services/.*\.py$
        pass_filenames: false
      - id: ty
        name: ty check
        entry: infra/python-services.sh ty check
        language: system
        files: ^services/.*\.py$
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: infra/rust-services.sh cargo fmt --check
        language: system
        files: ^(services|infra)/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: infra/rust-services.sh cargo clippy --all-targets -- -D warnings
        language: system
        files: ^(services|infra)/.*(\.rs|Cargo\.(toml|lock)|clippy\.toml)$
        pass_filenames: false
      - id: seat-hold-contract
        name: export seat-hold contract
        entry: bash -c 'cd services/seat-hold && cargo run --quiet --bin export-openapi'
        language: system
        files: ^(services/seat-hold/.*\.rs|contracts/seat-hold\.openapi\.json)$
        pass_filenames: false
      - id: contract
        name: export contracts
        entry: env PYTHONPATH=src DB__NAME=unused DB__USER=unused DB__PASS=unused DB__HOST=unused infra/python-services.sh python -m scripts.export_openapi
        language: system
        files: ^(services/.*\.py|contracts/.*\.openapi\.json)$
        pass_filenames: false
