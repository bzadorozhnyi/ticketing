receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus scrapes the metrics from here instead of receiving them over OTLP: in the protobuf format every
  # series carries its start time, and Prometheus writes a 0 there, so rate() counts the first export of a new
  # series. Over OTLP it ignores the start time (TIK-58). A series of a process that stopped is dropped after
  # metric_expiration, which stays above OTEL_METRIC_EXPORT_INTERVAL (10 s in the overlay).
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 30s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
