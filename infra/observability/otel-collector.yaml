receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
  # Tail sampling (ADR 0010): every span of a trace waits here until decision_wait has passed since its first one,
  # then the whole trace is kept or dropped. A drop policy wins; otherwise any keep policy keeps it.
  # A span that ends later follows that decision: one with an error in a dropped trace is lost (measured), so a
  # flow that can fail late has to be kept at once. Metrics are never sampled. All spans of a trace must reach
  # the same collector: one replica.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    decision_cache:
      sampled_cache_size: 100000
    policies:
      - name: probes
        type: drop
        drop:
          drop_sub_policy:
            - name: probe-routes
              type: string_attribute
              string_attribute: { key: http.route, values: [/health, /ready] }
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency: { threshold_ms: 500 }
      # A purchase goes on in a saga after the gateway answered, for seconds or minutes: keeping it at once
      # keeps whatever its later spans turn out to be.
      - name: purchases
        type: and
        and:
          and_sub_policy:
            - name: post
              type: string_attribute
              string_attribute: { key: http.request.method, values: [POST] }
            - name: purchase-routes
              type: string_attribute
              string_attribute: { key: http.route, values: [/api/v1/holds, /api/v1/orders] }
      - name: baseline
        type: probabilistic
        probabilistic: { sampling_percentage: 5 }

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus scrapes the metrics from here instead of receiving them over OTLP: in the protobuf format every
  # series carries its start time, and Prometheus writes a 0 there, so rate() counts the first export of a new
  # series. Over OTLP it ignores the start time. A series of a process that stopped is dropped after
  # metric_expiration, which stays above OTEL_METRIC_EXPORT_INTERVAL (10 s in the overlay).
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 30s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
