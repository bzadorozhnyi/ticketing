global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Services push their metrics through the collector over OTLP; samples can arrive late.
storage:
  tsdb:
    out_of_order_time_window: 30m

rule_files: [rules/slo.yaml]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
