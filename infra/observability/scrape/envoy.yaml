# What clients get from Envoy at the edge (infra/k8s/edge): the 5xx it answers itself, such as 503 with no ready gateway
# pod, never reach the gateway's metrics. Prometheus finds Envoy's pods through the Kubernetes API (RBAC in
# infra/k8s/observability/prometheus.yaml); Envoy Gateway opens the port named `metrics` on each.
scrape_configs:
  - job_name: envoy
    metrics_path: /stats/prometheus
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [envoy-gateway-system]
        selectors:
          - role: pod
            label: app.kubernetes.io/component=proxy
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    # Envoy exposes about 2000 series; these are the requests of the HTTPS listener and the route to the gateway.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: envoy_http_downstream_rq_xx|envoy_http_downstream_rq_total|envoy_cluster_upstream_rq_xx|envoy_cluster_membership_healthy|envoy_cluster_upstream_rq_pending_overflow|envoy_cluster_upstream_cx_connect_fail
        action: keep
      - source_labels: [__name__, envoy_http_conn_manager_prefix, envoy_cluster_name]
        regex: envoy_http_[^;]*;https-.*;|envoy_cluster_[^;]*;;httproute/.*
        action: keep
