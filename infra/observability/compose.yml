# Traces and metrics: services -> OTel Collector -> Tempo, and Prometheus scrapes the collector -> Grafana. See ADR 0006.
# From the repo root: docker compose -f docker-compose.yml -f infra/observability/compose.yml up -d
# Grafana: http://localhost:3000, dashboards without a login, Explore as admin/admin (local only).
#   Dashboards (grafana/dashboards/): Services, Purchase, SLO. They are files: a change in the UI is not saved.
# Prometheus: http://localhost:9090, SLO alerts on /alerts (rules/slo.yaml; checked by infra/check-observability.sh).
services:
  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [tempo, prometheus]

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
      # A 0 at the start time of a new series, so rate() counts its first scrape.
      - --enable-feature=exemplar-storage,created-timestamp-zero-ingestion
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./infra/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo]

  gateway:
    environment: &telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Every 10 s instead of the default 60 s, so a short experiment shows on a dashboard.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    depends_on: [otel-collector]

  catalog:
    environment: *telemetry
    depends_on: [otel-collector]

  booking:
    environment: *telemetry
    depends_on: [otel-collector]

  booking-relay:
    environment: *telemetry
    depends_on: [otel-collector]

  booking-saga:
    environment: *telemetry
    depends_on: [otel-collector]

  payment:
    environment: *telemetry
    depends_on: [otel-collector]

  payment-consumer:
    environment: *telemetry
    depends_on: [otel-collector]

  seat-hold:
    environment: *telemetry
    depends_on: [otel-collector]

volumes:
  tempo-data:
  prometheus-data:
