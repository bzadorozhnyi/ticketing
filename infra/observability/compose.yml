# Traces and metrics: services -> OTel Collector -> Tempo and Prometheus -> Grafana. See ADR 0006.
# From the repo root: docker compose -f docker-compose.yml -f infra/observability/compose.yml up -d
# Grafana: http://localhost:3000, dashboards without a login, Explore as admin/admin (local only).
# Prometheus: http://localhost:9090
services:
  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [tempo, prometheus]

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo]

volumes:
  tempo-data:
  prometheus-data:
