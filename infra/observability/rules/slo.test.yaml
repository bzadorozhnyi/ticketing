# Unit tests of slo.yaml with synthetic series, one sample a minute: infra/check-observability.sh.
# Native histograms, schema 0: bucket i holds values in (2^(i-1), 2^i], `offset` is the first i.
rule_files: [slo.yaml]
evaluation_interval: 1m

tests:
  # 600 requests a minute; at 60m every request fails, at 80m the gateway is fixed.
  # The 1 h error ratio passes 14.4 x 0.5 % = 7.2 % after 4.3 minutes of the outage.
  - name: a full outage pages within 5 minutes and clears within 5 minutes of the fix
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/events", http_response_status_code="200"}'
        values: '{{count:0 sum:0}}+{{count:600 sum:30}}x60 {{count:36000 sum:1800}}x19 {{count:36600 sum:1830}}+{{count:600 sum:30}}x29'
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/events", http_response_status_code="503"}'
        values: '{{count:0 sum:0}}x60 {{count:600 sum:30}}+{{count:600 sum:30}}x19 {{count:12000 sum:600}}x29'
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/holds", http_response_status_code="201"}'
        values: '{{count:0 sum:0}}+{{count:45 sum:1}}x110'
    promql_expr_test:
      - expr: slo:checkout_availability:error_ratio_rate5m
        eval_time: 70m
        exp_samples: [{ labels: 'slo:checkout_availability:error_ratio_rate5m', value: 0 }]
    alert_rule_test:
      - alertname: BrowseAvailabilityFastBurn
        eval_time: 64m
      - alertname: BrowseAvailabilityFastBurn
        eval_time: 65m
        exp_alerts:
          - exp_labels: { severity: page, slo: browse-availability }
            exp_annotations:
              summary: "Catalog reads: 5xx spend 2 % of the 30-day budget per hour; Services dashboard"
              description: "Burn rate 16.69 over 1 h"
      - alertname: BrowseAvailabilityFastBurn
        eval_time: 83m
        exp_alerts:
          - exp_labels: { severity: page, slo: browse-availability }
            exp_annotations:
              summary: "Catalog reads: 5xx spend 2 % of the 30-day budget per hour; Services dashboard"
              description: "Burn rate 67.05 over 1 h"
      - alertname: BrowseAvailabilityFastBurn
        eval_time: 84m

  # 4 % of requests fail from the start: burn rate 8, the budget lasts under 4 days.
  - name: a steady small error rate pages through the slow burn only
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/holds", http_response_status_code="201"}'
        values: '{{count:0 sum:0}}+{{count:576 sum:30}}x60'
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/holds", http_response_status_code="503"}'
        values: '{{count:0 sum:0}}+{{count:24 sum:1}}x60'
    alert_rule_test:
      - alertname: CheckoutAvailabilityFastBurn
        eval_time: 40m
      - alertname: CheckoutAvailabilitySlowBurn
        eval_time: 40m
        exp_alerts:
          - exp_labels: { severity: page, slo: checkout-availability }
            exp_annotations:
              summary: "Checkout (holds, orders): 5xx spend 5 % of the 30-day budget in 6 hours; Services dashboard"
              description: "Burn rate 8 over 6 h"

  - name: errors outside /api and 4xx do not count
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/events", http_response_status_code="429"}'
        values: '{{count:0 sum:0}}+{{count:600 sum:30}}x60'
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/ready", http_response_status_code="503"}'
        values: '{{count:0 sum:0}}+{{count:600 sum:30}}x60'
    promql_expr_test:
      - expr: slo:browse_availability:error_ratio_rate1h
        eval_time: 60m
        exp_samples: [{ labels: 'slo:browse_availability:error_ratio_rate1h', value: 0 }]

  # 600 GETs a minute in (0.125 s, 0.25 s]; from 60m half of them take (0.5 s, 1 s].
  # The 1 h share of slow ones passes 14.4 x 1 % = 14.4 % after 18 minutes.
  - name: slow reads page through the fast burn
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/events", http_request_method="GET", http_response_status_code="200"}'
        values: '{{schema:0 count:0 sum:0 offset:-2 buckets:[0 0 0]}}+{{schema:0 count:600 sum:120 offset:-2 buckets:[600 0 0]}}x60 {{schema:0 count:36600 sum:7425 offset:-2 buckets:[36300 0 300]}}+{{schema:0 count:600 sum:285 offset:-2 buckets:[300 0 300]}}x29'
    alert_rule_test:
      - alertname: GatewayReadLatencyFastBurn
        eval_time: 75m
      - alertname: GatewayReadLatencyFastBurn
        eval_time: 80m
        exp_alerts:
          - exp_labels: { severity: page, slo: gateway-read-latency }
            exp_annotations:
              summary: "Slow GETs spend 2 % of the 30-day budget per hour; Services dashboard"
              description: "Burn rate 16.95 over 1 h"
    promql_expr_test:
      - expr: slo:gateway_read_latency:error_ratio_rate5m
        eval_time: 80m
        exp_samples: [{ labels: 'slo:gateway_read_latency:error_ratio_rate5m', value: 0.5 }]

  # 10 orders a minute finish in (4 s, 8 s]; from 60m they take (16 s, 32 s].
  - name: slow purchases page through the fast burn
    interval: 1m
    input_series:
      - series: 'booking_order_duration_seconds{job="booking-saga", outcome="confirmed"}'
        values: '{{schema:0 count:0 sum:0 offset:3 buckets:[0 0 0]}}+{{schema:0 count:10 sum:60 offset:3 buckets:[10 0 0]}}x60 {{schema:0 count:610 sum:3800 offset:3 buckets:[600 0 10]}}+{{schema:0 count:10 sum:200 offset:3 buckets:[0 0 10]}}x19'
    alert_rule_test:
      - alertname: PurchaseFastBurn
        eval_time: 65m
      - alertname: PurchaseFastBurn
        eval_time: 70m
        exp_alerts:
          - exp_labels: { severity: page, slo: purchase }
            exp_annotations:
              summary: "Slow purchases spend 2 % of the 30-day budget per hour; Purchase dashboard"
              description: "Burn rate 16.95 over 1 h"

  # Orders keep coming; the last one finishes at 30m. From 39m the 10 m window holds only samples
  # after it, so the rule holds, and the alert fires 5m later.
  - name: orders that stop finishing page although no order is slow
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds{job="booking", http_route="/api/v1/orders", http_request_method="POST", http_response_status_code="202"}'
        values: '{{count:0 sum:0}}+{{count:10 sum:1}}x60'
      - series: 'booking_order_duration_seconds{job="booking-saga", outcome="confirmed"}'
        values: '{{schema:0 count:0 sum:0 offset:3 buckets:[0]}}+{{schema:0 count:10 sum:60 offset:3 buckets:[10]}}x30 {{schema:0 count:300 sum:1800 offset:3 buckets:[300]}}x30'
    alert_rule_test:
      - alertname: OrdersNotFinishing
        eval_time: 30m
      - alertname: OrdersNotFinishing
        eval_time: 43m
      - alertname: OrdersNotFinishing
        eval_time: 44m
        exp_alerts:
          - exp_labels: { severity: page, slo: purchase }
            exp_annotations:
              summary: "Orders are created but none has finished for 10 minutes; Purchase dashboard"
              description: "The saga worker, the relay, RabbitMQ or payment may be down"
      - alertname: PurchaseFastBurn
        eval_time: 44m

  # TIK-56, round 5: a locked table made every hold fail while the reads of the catalog went on, 20 times
  # as many. One SLO over all requests stayed at 3.75 % errors, under the 7.2 % that pages.
  - name: a checkout outage pages although the reads around it are fine
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/events", http_response_status_code="200"}'
        values: '{{count:0 sum:0}}+{{count:1200 sum:6}}x80'
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/holds", http_response_status_code="201"}'
        values: '{{count:0 sum:0}}+{{count:45 sum:1}}x60 {{count:2700 sum:60}}x20'
      - series: 'http_server_request_duration_seconds{job="gateway", http_route="/api/v1/holds", http_response_status_code="503"}'
        values: '{{count:0 sum:0}}x60 {{count:45 sum:225}}+{{count:45 sum:225}}x19'
    alert_rule_test:
      - alertname: CheckoutAvailabilityFastBurn
        eval_time: 64m
      - alertname: CheckoutAvailabilityFastBurn
        eval_time: 65m
        exp_alerts:
          - exp_labels: { severity: page, slo: checkout-availability }
            exp_annotations:
              summary: "Checkout (holds, orders): 5xx spend 2 % of the 30-day budget per hour; Services dashboard"
              description: "Burn rate 16.69 over 1 h"
      - alertname: BrowseAvailabilityFastBurn
        eval_time: 70m
    promql_expr_test:
      - expr: slo:browse_availability:error_ratio_rate5m
        eval_time: 70m
        exp_samples: [{ labels: 'slo:browse_availability:error_ratio_rate5m', value: 0 }]
      - expr: slo:checkout_availability:error_ratio_rate5m
        eval_time: 70m
        exp_samples: [{ labels: 'slo:checkout_availability:error_ratio_rate5m', value: 1 }]

  # TIK-56, round 2: a stopped relay showed only as a missing line. booking restarts with a new instance
  # and must not page; prometheus is scraped and stops sending target_info, but `up` covers it.
  - name: a process that stops exporting pages within 2 minutes, a restart does not
    interval: 1m
    input_series:
      - series: 'target_info{job="booking-relay", instance="a"}'
        values: '1x30'
      - series: 'target_info{job="booking", instance="old"}'
        values: '1x30'
      - series: 'target_info{job="booking", instance="new"}'
        values: '_x30 1x29'
      - series: 'target_info{job="prometheus", instance="localhost:9090"}'
        values: '1x30'
      - series: 'up{job="prometheus", instance="localhost:9090"}'
        values: '1x60'
    alert_rule_test:
      - alertname: ProcessNotExporting
        eval_time: 31m
      - alertname: ProcessNotExporting
        eval_time: 32m
        exp_alerts:
          - exp_labels: { severity: page, job: booking-relay }
            exp_annotations:
              summary: "booking-relay has sent no telemetry for 2 minutes: stopped or cannot reach the collector"
              description: "Exports come every 10 s in the overlay (OTEL_METRIC_EXPORT_INTERVAL); keep the window above it"

  # A replica 3 s behind is normal under load; 8 s from 4m pages after a minute.
  - name: a replica that stays behind pages, a short delay does not
    interval: 1m
    input_series:
      - series: 'db_replica_lag_seconds{job="booking"}'
        values: '0 3 3 0 8 8 8 0'
      - series: 'db_replication_slot_retained_bytes{job="booking"}'
        values: '0x7'
    alert_rule_test:
      - alertname: BookingReplicaLagging
        eval_time: 2m
      - alertname: BookingReplicaLagging
        eval_time: 4m
      - alertname: BookingReplicaLagging
        eval_time: 5m
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: "booking's replica applies WAL 8 s behind the primary; order reads are that old"
              description: "Services dashboard, Replication; GET /orders/{id} may answer 404 for an order just created"
      - alertname: BookingReplicaNotStreaming
        eval_time: 6m

  # The replica stops at 2m: its lag is gone, the slot keeps growing.
  - name: a replica that stops streaming pages while its slot keeps WAL
    interval: 1m
    input_series:
      - series: 'db_replica_lag_seconds{job="booking"}'
        values: '0 0 0 stale'
      - series: 'db_replication_slot_retained_bytes{job="booking"}'
        values: '0 0 0 1048576 2097152 3145728 4194304'
    alert_rule_test:
      - alertname: BookingReplicaNotStreaming
        eval_time: 4m
      - alertname: BookingReplicaNotStreaming
        eval_time: 5m
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: "booking's replica is not streaming; the primary keeps 3MiB of WAL for it"
              description: "Order reads fail while it is down; a slot without its replica fills the primary's disk"
