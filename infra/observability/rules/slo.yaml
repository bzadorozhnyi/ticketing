# SLOs over 30 days and their burn-rate alerts, see ADR 0006. Tests: slo.test.yaml (infra/check-observability.sh).
#
# For every SLO: the share of bad events over several windows (error_ratio_rate<window>) and the share
# allowed (error_budget = 1 - objective). Burn rate = error ratio / error budget: 1 spends the budget
# in exactly 30 days. An alert needs a long and a short window together: the long one proves the burn
# is real, the short one that it still goes on, so the alert clears soon after a fix.
#   page: burn rate 14.4 over 1 h and 5 m (2 % of the budget in an hour)
#   page: burn rate 6 over 6 h and 30 m (5 % of the budget in 6 hours)
# Without traffic a ratio is NaN and no alert fires.

groups:
  # Availability per user journey, each with its own budget: in one SLO over all /api requests the reads
  # of the catalog, far more numerous, would hide an outage of checkout. A request is good without a 5xx;
  # 4xx and 429 are the client's side.
  # Browsing the catalog.
  - name: slo-browse-availability
    rules:
      - record: slo:browse_availability:error_budget
        expr: vector(0.005)
      - record: slo:browse_availability:error_ratio_rate5m
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*", http_response_status_code=~"5.."}[5m]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*"}[5m])))
      - record: slo:browse_availability:error_ratio_rate30m
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*", http_response_status_code=~"5.."}[30m]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*"}[30m])))
      - record: slo:browse_availability:error_ratio_rate1h
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*", http_response_status_code=~"5.."}[1h]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*"}[1h])))
      - record: slo:browse_availability:error_ratio_rate6h
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*", http_response_status_code=~"5.."}[6h]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*"}[6h])))
      - alert: BrowseAvailabilityFastBurn
        expr: |
          slo:browse_availability:error_ratio_rate1h / slo:browse_availability:error_budget > 14.4
          and slo:browse_availability:error_ratio_rate5m / slo:browse_availability:error_budget > 14.4
        labels: { severity: page, slo: browse-availability }
        annotations:
          summary: "Catalog reads: 5xx spend 2 % of the 30-day budget per hour; Services dashboard"
          description: "Burn rate {{ $value | humanize }} over 1 h"
      - alert: BrowseAvailabilitySlowBurn
        expr: |
          slo:browse_availability:error_ratio_rate6h / slo:browse_availability:error_budget > 6
          and slo:browse_availability:error_ratio_rate30m / slo:browse_availability:error_budget > 6
        labels: { severity: page, slo: browse-availability }
        annotations:
          summary: "Catalog reads: 5xx spend 5 % of the 30-day budget in 6 hours; Services dashboard"
          description: "Burn rate {{ $value | humanize }} over 6 h"

  # Checkout: holds and orders, the requests that sell a seat; far fewer than the reads.
  - name: slo-checkout-availability
    rules:
      - record: slo:checkout_availability:error_budget
        expr: vector(0.005)
      - record: slo:checkout_availability:error_ratio_rate5m
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*", http_response_status_code=~"5.."}[5m]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*"}[5m])))
      - record: slo:checkout_availability:error_ratio_rate30m
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*", http_response_status_code=~"5.."}[30m]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*"}[30m])))
      - record: slo:checkout_availability:error_ratio_rate1h
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*", http_response_status_code=~"5.."}[1h]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*"}[1h])))
      - record: slo:checkout_availability:error_ratio_rate6h
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*", http_response_status_code=~"5.."}[6h]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*"}[6h])))
      - alert: CheckoutAvailabilityFastBurn
        expr: |
          slo:checkout_availability:error_ratio_rate1h / slo:checkout_availability:error_budget > 14.4
          and slo:checkout_availability:error_ratio_rate5m / slo:checkout_availability:error_budget > 14.4
        labels: { severity: page, slo: checkout-availability }
        annotations:
          summary: "Checkout (holds, orders): 5xx spend 2 % of the 30-day budget per hour; Services dashboard"
          description: "Burn rate {{ $value | humanize }} over 1 h"
      - alert: CheckoutAvailabilitySlowBurn
        expr: |
          slo:checkout_availability:error_ratio_rate6h / slo:checkout_availability:error_budget > 6
          and slo:checkout_availability:error_ratio_rate30m / slo:checkout_availability:error_budget > 6
        labels: { severity: page, slo: checkout-availability }
        annotations:
          summary: "Checkout (holds, orders): 5xx spend 5 % of the 30-day budget in 6 hours; Services dashboard"
          description: "Burn rate {{ $value | humanize }} over 6 h"

  # Every request at Envoy, the edge of the cluster (infra/k8s/edge), as the client got it. The gateway's metrics miss
  # what Envoy answers itself: 503 when no gateway pod is ready or its circuit breaker is full. A 5xx of the gateway
  # counts here too, so an outage behind the gateway pages twice, once here and once for its user journey.
  # Compose has no Envoy: the ratio is empty there and nothing fires.
  - name: slo-edge-availability
    rules:
      - record: slo:edge_availability:error_budget
        expr: vector(0.005)
      - record: slo:edge_availability:error_ratio_rate5m
        expr: |
          (sum(rate(envoy_http_downstream_rq_xx{job="envoy", envoy_response_code_class="5"}[5m])) or vector(0))
          / sum(rate(envoy_http_downstream_rq_total{job="envoy"}[5m]))
      - record: slo:edge_availability:error_ratio_rate30m
        expr: |
          (sum(rate(envoy_http_downstream_rq_xx{job="envoy", envoy_response_code_class="5"}[30m])) or vector(0))
          / sum(rate(envoy_http_downstream_rq_total{job="envoy"}[30m]))
      - record: slo:edge_availability:error_ratio_rate1h
        expr: |
          (sum(rate(envoy_http_downstream_rq_xx{job="envoy", envoy_response_code_class="5"}[1h])) or vector(0))
          / sum(rate(envoy_http_downstream_rq_total{job="envoy"}[1h]))
      - record: slo:edge_availability:error_ratio_rate6h
        expr: |
          (sum(rate(envoy_http_downstream_rq_xx{job="envoy", envoy_response_code_class="5"}[6h])) or vector(0))
          / sum(rate(envoy_http_downstream_rq_total{job="envoy"}[6h]))
      - alert: EdgeAvailabilityFastBurn
        expr: |
          slo:edge_availability:error_ratio_rate1h / slo:edge_availability:error_budget > 14.4
          and slo:edge_availability:error_ratio_rate5m / slo:edge_availability:error_budget > 14.4
        labels: { severity: page, slo: edge-availability }
        annotations:
          summary: "Envoy at the edge: 5xx spend 2 % of the 30-day budget per hour; Services dashboard, Edge"
          description: "Burn rate {{ $value | humanize }} over 1 h"
      - alert: EdgeAvailabilitySlowBurn
        expr: |
          slo:edge_availability:error_ratio_rate6h / slo:edge_availability:error_budget > 6
          and slo:edge_availability:error_ratio_rate30m / slo:edge_availability:error_budget > 6
        labels: { severity: page, slo: edge-availability }
        annotations:
          summary: "Envoy at the edge: 5xx spend 5 % of the 30-day budget in 6 hours; Services dashboard, Edge"
          description: "Burn rate {{ $value | humanize }} over 6 h"

  # GET requests to /api through the gateway answered within 300 ms, errors included.
  # histogram_fraction interpolates inside the bucket that holds 300 ms.
  - name: slo-gateway-read-latency
    rules:
      - record: slo:gateway_read_latency:error_budget
        expr: vector(0.01)
      - record: slo:gateway_read_latency:error_ratio_rate5m
        expr: 1 - histogram_fraction(0, 0.3, sum(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/.*", http_request_method="GET"}[5m])))
      - record: slo:gateway_read_latency:error_ratio_rate30m
        expr: 1 - histogram_fraction(0, 0.3, sum(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/.*", http_request_method="GET"}[30m])))
      - record: slo:gateway_read_latency:error_ratio_rate1h
        expr: 1 - histogram_fraction(0, 0.3, sum(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/.*", http_request_method="GET"}[1h])))
      - record: slo:gateway_read_latency:error_ratio_rate6h
        expr: 1 - histogram_fraction(0, 0.3, sum(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/.*", http_request_method="GET"}[6h])))
      - alert: GatewayReadLatencyFastBurn
        expr: |
          slo:gateway_read_latency:error_ratio_rate1h / slo:gateway_read_latency:error_budget > 14.4
          and slo:gateway_read_latency:error_ratio_rate5m / slo:gateway_read_latency:error_budget > 14.4
        labels: { severity: page, slo: gateway-read-latency }
        annotations:
          summary: "Slow GETs spend 2 % of the 30-day budget per hour; Services dashboard"
          description: "Burn rate {{ $value | humanize }} over 1 h"
      - alert: GatewayReadLatencySlowBurn
        expr: |
          slo:gateway_read_latency:error_ratio_rate6h / slo:gateway_read_latency:error_budget > 6
          and slo:gateway_read_latency:error_ratio_rate30m / slo:gateway_read_latency:error_budget > 6
        labels: { severity: page, slo: gateway-read-latency }
        annotations:
          summary: "Slow GETs spend 5 % of the 30-day budget in 6 hours; Services dashboard"
          description: "Burn rate {{ $value | humanize }} over 6 h"

  # Orders that reached confirmed or failed within 10 s of being created. An order that never
  # finishes is never counted here: OrdersNotFinishing covers it.
  - name: slo-purchase
    rules:
      - record: slo:purchase:error_budget
        expr: vector(0.01)
      - record: slo:purchase:error_ratio_rate5m
        expr: 1 - histogram_fraction(0, 10, sum(rate(booking_order_duration_seconds[5m])))
      - record: slo:purchase:error_ratio_rate30m
        expr: 1 - histogram_fraction(0, 10, sum(rate(booking_order_duration_seconds[30m])))
      - record: slo:purchase:error_ratio_rate1h
        expr: 1 - histogram_fraction(0, 10, sum(rate(booking_order_duration_seconds[1h])))
      - record: slo:purchase:error_ratio_rate6h
        expr: 1 - histogram_fraction(0, 10, sum(rate(booking_order_duration_seconds[6h])))
      - alert: PurchaseFastBurn
        expr: |
          slo:purchase:error_ratio_rate1h / slo:purchase:error_budget > 14.4
          and slo:purchase:error_ratio_rate5m / slo:purchase:error_budget > 14.4
        labels: { severity: page, slo: purchase }
        annotations:
          summary: "Slow purchases spend 2 % of the 30-day budget per hour; Purchase dashboard"
          description: "Burn rate {{ $value | humanize }} over 1 h"
      - alert: PurchaseSlowBurn
        expr: |
          slo:purchase:error_ratio_rate6h / slo:purchase:error_budget > 6
          and slo:purchase:error_ratio_rate30m / slo:purchase:error_budget > 6
        labels: { severity: page, slo: purchase }
        annotations:
          summary: "Slow purchases spend 5 % of the 30-day budget in 6 hours; Purchase dashboard"
          description: "Burn rate {{ $value | humanize }} over 6 h"
      - alert: OrdersNotFinishing
        expr: |
          sum(histogram_count(rate(http_server_request_duration_seconds{job="booking", http_request_method="POST", http_route="/api/v1/orders", http_response_status_code="202"}[10m]))) > 0
          unless sum(histogram_count(rate(booking_order_duration_seconds[10m]))) > 0
        for: 5m
        labels: { severity: page, slo: purchase }
        annotations:
          summary: "Orders are created but none has finished for 10 minutes; Purchase dashboard"
          description: "The saga worker, the relay, RabbitMQ or payment may be down"

  # The share of bad events over the whole 30 days, for the SLO dashboard; no alert reads it. A rate over 30 days
  # reads every sample of the window, so it runs less often. A recorded sample stays visible to a query for 5 minutes
  # (the lookback), so the interval stays below that.
  - name: slo-30-days
    interval: 2m
    rules:
      - record: slo:browse_availability:error_ratio_rate30d
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*", http_response_status_code=~"5.."}[30d]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/events.*"}[30d])))
      - record: slo:checkout_availability:error_ratio_rate30d
        expr: |
          (sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*", http_response_status_code=~"5.."}[30d]))) or vector(0))
          / sum(histogram_count(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/v1/(holds|orders).*"}[30d])))
      - record: slo:gateway_read_latency:error_ratio_rate30d
        expr: 1 - histogram_fraction(0, 0.3, sum(rate(http_server_request_duration_seconds{job="gateway", http_route=~"/api/.*", http_request_method="GET"}[30d])))
      - record: slo:edge_availability:error_ratio_rate30d
        expr: |
          (sum(rate(envoy_http_downstream_rq_xx{job="envoy", envoy_response_code_class="5"}[30d])) or vector(0))
          / sum(rate(envoy_http_downstream_rq_total{job="envoy"}[30d]))
      - record: slo:purchase:error_ratio_rate30d
        expr: 1 - histogram_fraction(0, 10, sum(rate(booking_order_duration_seconds[30d])))

  # Not an SLO: a process that stops exporting has no requests to fail, so no ratio above notices it.
  # The collector exposes a `target_info` for each process while it exports; a job seen in the last hour
  # and absent for 2 minutes is down. Scraped jobs have `up` instead.
  - name: processes
    rules:
      - alert: ProcessNotExporting
        expr: |
          group by (job) (present_over_time(target_info[1h]))
          unless on (job) group by (job) (present_over_time(target_info[2m]))
          unless on (job) group by (job) (up)
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} has sent no telemetry for 2 minutes: stopped or cannot reach the collector"
          description: "Exports come every 10 s in the overlay (OTEL_METRIC_EXPORT_INTERVAL); keep the window above it"

  # booking's read replica. The API process reads both gauges from the primary every 5 s.
  - name: replication
    rules:
      - alert: BookingReplicaLagging
        expr: max(db_replica_lag_seconds) > 5
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "booking's replica applies WAL {{ $value | humanize }} s behind the primary; order reads are that old"
          description: "Services dashboard, Replication; GET /orders/{id} may answer 404 for an order just created"
      # The slot still holds WAL but the replica does not stream: it is down or cut off, and the WAL it has not
      # taken stays on the primary's disk.
      - alert: BookingReplicaNotStreaming
        expr: max(db_replication_slot_retained_bytes) unless on () max(db_replica_lag_seconds)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "booking's replica is not streaming; the primary keeps {{ $value | humanize1024 }}B of WAL for it"
          description: "Order reads fail while it is down; a slot without its replica fills the primary's disk"
