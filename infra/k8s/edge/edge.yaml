# Envoy's own Deployment and Service, made by Envoy Gateway in envoy-gateway-system. kind maps localhost:8000 to the
# node's port 30080 (kind-cluster.yaml), so the Service takes that port; the API has no field for it, hence the patch.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: edge
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
      envoyPDB:
        minAvailable: 1
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 443
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: edge
    namespace: ticketing
---
# HTTPS only, with the certificate deploy.sh makes once (Secret edge-tls); clients may speak HTTP/1.1 or HTTP/2.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: edge-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway
spec:
  parentRefs:
    - name: edge
  rules:
    - backendRefs:
        - name: gateway
          port: 8000
---
# Envoy's side of the hop to the gateway. The gateway closes a kept-alive connection idle for 30 s
# (LIMITS__HEADER_TIMEOUT_SECONDS), so Envoy drops its own sooner and never sends on one being closed. Its connection
# and request limits (1024 by default) sit above the gateway's load shedding, 1000 per replica, with room for one
# Envoy pod carrying all of it: the gateway sheds first, with its own JSON answer.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gateway
  timeout:
    http:
      connectionIdleTimeout: 20s
  circuitBreaker:
    maxConnections: 4096
    maxPendingRequests: 4096
    maxParallelRequests: 4096
