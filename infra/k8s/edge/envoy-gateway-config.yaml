# Envoy Gateway's own configuration, as its release ships it plus leaderElection. The controller must renew its
# lease within renewDeadline or it gives up and exits; the default 10 s was too short when the one-node cluster was
# busy (a deploy, a load test), and every exit left the edge's Envoy pods without config until they restarted.
# With one replica nobody else waits for the lease, so longer times cost nothing until a controller dies: then a new
# one waits up to leaseDuration, while Envoy keeps serving the last config it had.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
data:
  envoy-gateway.yaml: |
    apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyGateway
    extensionApis: {}
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      kubernetes:
        rateLimitDeployment:
          container:
            image: docker.io/envoyproxy/ratelimit:5ae0682e
          patch:
            type: StrategicMerge
            value:
              spec:
                template:
                  spec:
                    containers:
                    - imagePullPolicy: IfNotPresent
                      name: envoy-ratelimit
        shutdownManager:
          image: envoyproxy/gateway:v1.10.0
        leaderElection:
          leaseDuration: 60s
          renewDeadline: 45s
          retryPeriod: 5s
      type: Kubernetes
