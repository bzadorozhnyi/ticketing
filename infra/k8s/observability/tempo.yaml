# Headless: tempo.yaml listens on the address `tempo` resolves to, which must be the pod's own, as in compose.
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  clusterIP: None
  selector:
    app: tempo
  ports:
    - { name: http, port: 3200 }
    - { name: otlp-grpc, port: 4317 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: tempo
          image: grafana/tempo:3.1.1
          args: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - containerPort: 3200
            - containerPort: 4317
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: config
          configMap: { name: tempo }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
