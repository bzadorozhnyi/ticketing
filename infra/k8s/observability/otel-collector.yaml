apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - { name: otlp-http, port: 4318 }
    - { name: telemetry, port: 8888 }
    - { name: metrics, port: 8889 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.164.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4318
            - containerPort: 8888
            - containerPort: 8889
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
          # memory_limiter in the config is a share of this limit.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector }
---
# What every service adds to its environment to export, as the &telemetry anchor of the compose overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
