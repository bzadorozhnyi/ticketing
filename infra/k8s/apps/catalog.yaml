apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector:
    app: catalog
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ticketing/catalog
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: catalog }
          env:
            - name: DB__USER
              valueFrom: { secretKeyRef: { name: postgres, key: user } }
            - name: DB__PASS
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
          # Keeps serving while the Service stops routing here; SIGTERM comes after it.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
