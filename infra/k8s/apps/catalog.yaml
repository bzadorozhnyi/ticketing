apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector:
    app: catalog
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
# No replicas: the HorizontalPodAutoscaler below owns them, and kubectl apply would undo its choice.
spec:
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ticketing/catalog
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: catalog }
            - configMapRef: { name: telemetry }
          env:
            - name: DB__USER
              valueFrom: { secretKeyRef: { name: postgres, key: user } }
            - name: DB__PASS
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
          # Keeps serving while the Service stops routing here; SIGTERM comes after it.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            # One uvicorn process uses at most one core; the autoscaler's target is a share of this.
            requests: { cpu: 1000m, memory: 128Mi }
            limits: { memory: 256Mi }
---
# A voluntary eviction, such as a node drain, waits while it would leave no pod of catalog.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: catalog
---
# Adds pods when their average CPU passes 70 % of the request; removes them 5 minutes after it falls.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
