# The ticketing API as MCP tools; reached only through the gateway's /mcp, which checks the token (ADR 0017).
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app: mcp
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: ticketing/mcp
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: telemetry }
          env:
            - name: OTEL_SERVICE_NAME
              value: mcp
          # Keeps serving while the Service stops routing here; SIGTERM comes after it.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { memory: 256Mi }
