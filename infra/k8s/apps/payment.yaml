apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    app: payment
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: ticketing/payment
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: payment }
          env:
            - name: OTEL_SERVICE_NAME
              value: payment
            - name: DB__USER
              valueFrom: { secretKeyRef: { name: postgres, key: user } }
            - name: DB__PASS
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-consumer
  template:
    metadata:
      labels:
        app: payment-consumer
    spec:
      containers:
        - name: payment-consumer
          image: ticketing/payment
          command: ["python", "-m", "scripts.consume"]
          envFrom:
            - configMapRef: { name: payment }
          env:
            - name: OTEL_SERVICE_NAME
              value: payment-consumer
            - name: DB__USER
              valueFrom: { secretKeyRef: { name: postgres, key: user } }
            - name: DB__PASS
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
            - name: RABBITMQ__USER
              valueFrom: { secretKeyRef: { name: rabbitmq, key: user } }
            - name: RABBITMQ__PASS
              valueFrom: { secretKeyRef: { name: rabbitmq, key: password } }
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { memory: 256Mi }
