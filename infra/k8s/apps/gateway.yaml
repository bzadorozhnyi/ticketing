apiVersion: v1
kind: Service
metadata:
  name: gateway
# Reached through Envoy at the edge (infra/k8s/edge), which balances every request across the pods.
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ticketing/gateway
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: gateway }
            - configMapRef: { name: telemetry }
          env:
            - name: OTEL_SERVICE_NAME
              value: gateway
            - name: AUTH__JWT_SECRET
              valueFrom: { secretKeyRef: { name: gateway, key: jwt-secret } }
            # The limits must fit the memory limit below, or a spike gets the pod OOMKilled with every
            # connection on it. Measured in kind: ~20 KiB per open connection, ~10 MiB at rest; 4,000
            # connections plus 1,000 requests sending 64 KiB bodies peaked at 170 MiB. Worst case:
            # 10 + MAX_CONNECTIONS x 20 KiB + MAX_IN_FLIGHT (1,000) x (MAX_BODY_BYTES + ~30 KiB) = ~205 MiB.
            - name: LIMITS__MAX_CONNECTIONS
              value: "5000"
            - name: LIMITS__MAX_BODY_BYTES
              value: "65536"
          # Keeps serving while the Service stops routing here; SIGTERM comes after it.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# A voluntary eviction, such as a node drain, waits while it would leave no pod of gateway.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
