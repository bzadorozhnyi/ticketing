# booking's Postgres: a primary and two streaming replicas run by CloudNativePG (cnpg/install-cnpg.sh, ADR 0012).
# The operator points the Service booking-db-rw at the primary and booking-db-ro at the replicas, and promotes a
# replica when the primary fails. It creates the owner `booking` with a random password in the Secret booking-db-app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: booking-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:452a15584e2aa1ce658c4ae8538b5dc157eb031d41b82fd19882e0c03bcec01d
  bootstrap:
    initdb:
      database: booking_db
      owner: booking
  # booking's replication probe (core/replication.py) reads the replicas' state from the primary, which Postgres hides
  # from a role without pg_monitor. Without passwordSecret the operator leaves the password alone.
  managed:
    roles:
      - name: booking
        ensure: present
        login: true
        inRoles: [pg_monitor]
  # A commit is confirmed once one of the two replicas has its WAL on disk, so a failover loses no confirmed order
  # (ADR 0012). With both replicas gone, writes wait for one to return; the operator promotes no replica that may
  # lack a confirmed commit.
  postgresql:
    synchronous:
      method: any
      # Chosen for 2 replicas. With N replicas and number W, writes go on with up to N - W replicas down, and a
      # failover can still happen with up to W - 1 replicas down beside the primary. Revisit it with `instances`.
      number: 1
      dataDurability: required
      failoverQuorum: true
  storage:
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
