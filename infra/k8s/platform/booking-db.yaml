# booking's Postgres: a primary and two streaming replicas run by CloudNativePG (cnpg/install-cnpg.sh, ADR 0012).
# The operator points the Service booking-db-rw at the primary and booking-db-ro at the replicas, and promotes a
# replica when the primary fails. It creates the owner `booking` with a random password in the Secret booking-db-app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: booking-db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:452a15584e2aa1ce658c4ae8538b5dc157eb031d41b82fd19882e0c03bcec01d
  bootstrap:
    initdb:
      database: booking_db
      owner: booking
  # booking's replication probe (core/replication.py) reads the replicas' state from the primary, which Postgres hides
  # from a role without pg_monitor. Without passwordSecret the operator leaves the password alone.
  managed:
    roles:
      - name: booking
        ensure: present
        login: true
        inRoles: [pg_monitor]
  storage:
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
