apiVersion: v1
kind: Service
metadata:
  name: seat-hold-db
spec:
  clusterIP: None
  selector:
    app: seat-hold-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seat-hold-db
spec:
  serviceName: seat-hold-db
  replicas: 1
  selector:
    matchLabels:
      app: seat-hold-db
  template:
    metadata:
      labels:
        app: seat-hold-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          # pg_stat_statements: time spent per statement; CREATE EXTENSION once. A transaction left idle for a minute
          # is ended: it would keep every deleted hold. See services/seat-hold/CLAUDE.md.
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "idle_in_transaction_session_timeout=60s"]
          env:
            - name: POSTGRES_DB
              value: seat_hold_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres, key: user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
