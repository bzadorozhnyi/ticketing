apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ticketing/catalog
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: catalog }
          env:
            - name: DB__USER
              valueFrom: { secretKeyRef: { name: postgres, key: user } }
            - name: DB__PASS
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
