# One node is enough for the services and their stores; localhost:8000 reaches the gateway's NodePort.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ticketing
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        listenAddress: 127.0.0.1
