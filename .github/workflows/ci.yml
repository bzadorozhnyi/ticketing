name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, booking, payment]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker compose up -d --wait ${{ matrix.service }}-db
      - run: cp .env.test.example .env.test
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ty check
      - run: uv run --frozen pytest

  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [services/gateway, services/seat-hold, infra/benchmark/stub]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - run: rustup component add clippy rustfmt
      - if: matrix.project == 'services/seat-hold'
        run: docker compose up -d --wait seat-hold-db
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ${{ matrix.project }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --release

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: services/gateway/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: services/seat-hold/Cargo.toml

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: infra/check-contracts.sh

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose build
