name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.areas.outputs.python }}
      rust: ${{ steps.areas.outputs.rust }}
      rust_services: ${{ steps.areas.outputs.rust_services }}
      images: ${{ steps.areas.outputs.images }}
      contracts: ${{ steps.areas.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        run: infra/changed_areas.py | tee -a "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: docker compose up -d --wait ${{ matrix.service }}-db
      - run: cp .env.test.example .env.test
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ty check
      - run: uv run --frozen pytest
      - if: hashFiles(format('services/{0}/src/tests_e2e/**', matrix.service)) != ''
        run: docker compose up -d --wait rabbitmq && uv run --frozen pytest src/tests_e2e

  rust:
    needs: changes
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - run: rustup component add clippy rustfmt
      - if: matrix.project == 'services/seat-hold'
        run: docker compose up -d --wait seat-hold-db
      - if: matrix.project == 'services/gateway'
        run: docker compose up -d --wait valkey
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ${{ matrix.project }}
      - if: matrix.project == 'services/seat-hold'
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres
      - if: matrix.project == 'services/seat-hold'
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5436/seat_hold_db
          SQLX_OFFLINE: "false"
        run: sqlx migrate run && cargo sqlx prepare --check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --release

  dependencies:
    needs: changes
    if: needs.changes.outputs.rust_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.rust_services) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: ${{ matrix.project }}/Cargo.toml

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: infra/check-contracts.sh

  images:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: services/${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  ci-passed:
    if: always()
    needs: [changes, python, rust, dependencies, contracts, images]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every job that had to run has passed"
