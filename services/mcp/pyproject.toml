[project]
name = "ticketing-mcp"
version = "0.1.0"
description = "MCP server: the ticketing API as tools for an LLM agent"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.5",
    "loguru==0.7.3",
    "mcp==2.3.0",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
    "aiohttp==3.14.5",
    "anyio==4.16.0",
    "httpx2==2.16.2",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.96",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "C901", "PLR1702"]
ignore = ["E731"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.14"
root = ["src"]
