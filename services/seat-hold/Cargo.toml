[package]
name = "seat-hold"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
config = { version = "0.15.27", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "futures"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "testing"] }
bon = "3.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.54.1", features = ["sync"] }

[profile.release]
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
excessive_nesting = "warn"
fallible_impl_from = "warn"
indexing_slicing = "warn"
missing_errors_doc = "allow"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
